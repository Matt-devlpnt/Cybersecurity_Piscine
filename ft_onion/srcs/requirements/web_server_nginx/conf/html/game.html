<!DOCTYPE html>
<html lang="fr">
    <head>
        <!-- Encodage et affichage -->
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">

        <!-- Informations sur le site -->
        <title>CHIFOUMI</title>
        <meta name="description" content="Bienvenue sur mon site web qui met en scene le fameux jeu chifoumi.">
        <meta name="author" content="Matthieu CORDES">

        <!-- Favicon et icônes -->
        <link rel="icon" href="/favicon/favicon.ico" sizes="any">
        <link rel="icon" href="/favicon/favicon.svg" type="image/svg+xml">
        <link rel="icon" type="image/png" sizes="32x32" href="/favicon/favicon-32x32.png">
        <link rel="apple-touch-icon" href="/favicon/apple-touch-icon.png">

        <link rel="preload" as="font" type="font/woff2" href="/fonts/FascinateInline-Regular/FascinateInline-Regular.woff2" crossorigin>

        <!-- CSS -->
        <link rel="stylesheet" href="/css/global.css">
        <link rel="stylesheet" href="/css/header.css">
        <link rel="stylesheet" href="/css/game.css">
        <link rel="stylesheet" href="/css/footer.css">

        <!-- Préchargement facultatif d'une image importante -->
        <link rel="preload" as="image" href="/images/ciseaux.svg">
        <link rel="preload" as="image" href="/images/feuille.svg">
        <link rel="preload" as="image" href="/images/pierre.svg">
        <link rel="preload" as="image" href="/images/ciseaux_robot.svg">
        <link rel="preload" as="image" href="/images/feuille_robot.svg">
        <link rel="preload" as="image" href="/images/pierre_robot.svg">

	<script src="/js/header.js" defer></script>
	<script src="/js/game.js" defer></script>

        <!-- JavaScript : chargé après l'analyse du HTML -->
    </head>
    <body>
        <!-- Contenu du site -->
        <header>
	    <a href="index.html">
                <img loading="lazy" src="/images/ciseaux.svg" alt="logo SHIFUMI">
	    </a>
            <h1 class="highlight">CHIFOUMI</h1>
        </header>

        <main>
	    <div>
	        <div id="chifoumi_roll"></div>
	        <div id="round_zone">
		    <p>Round 1</p>
		</div>
		<div id="score_zone">
		    <p id="robot_score">Robot: 0</p>
		    <p id="user_score">Guest: 0</p>
		</div>
	    </div>
	    <div>
	        <div id="dropzone">
		    <p id="drop_message">Dépose ton image ici</p>
		</div>
		<div id="dropzone_pierre"><img id="pierre" src="/images/pierre.svg" alt="pierre"></div>
		<div id="dropzone_feuille"><img id="feuille" src="/images/feuille.svg" alt="feuille"></div>
		<div id="dropzone_ciseaux"><img id="ciseaux" src="/images/ciseaux.svg" alt="ciseaux"></div>
	    </div>
        </main>

        <footer>
	    Made with &#10084;&#65039; by Matthieu CORDES
        </footer>
    </body>
</html>
